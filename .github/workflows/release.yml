name: Release

# Builds prebuilt artifacts and publishes them to a GitHub Release when a version tag
# is pushed. The owner cuts a release by pushing a tag:
#
#     git tag v0.1.0-beta && git push origin v0.1.0-beta
#
# Produces, for x86_64 and aarch64:
#   • a static musl binary (runs on every Linux distro — glibc, musl, old or new)
#   • a .tar.gz (binary + man page + shell completions + docs) and its .sha256
#   • a native .deb and .rpm (built with nfpm — one spec, both formats)
# jii shells out to the system's package managers, so it bundles no libs.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the Release and upload assets

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build · ${{ matrix.arch }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
            nfpm_arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: aarch64
            nfpm_arch: arm64
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@v2.85.4
        with:
          tool: cross

      - name: Install nfpm
        run: |
          set -euxo pipefail
          # nfpm is a Go tool (not a crate), so install it from goreleaser's apt repo.
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' \
            | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm
          nfpm --version

      - name: Build static musl binary
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Generate man page + shell completions
        run: |
          set -euxo pipefail
          # Arch-independent — emit them with a quick host build of jii.
          mkdir -p dist/completions
          cargo run --quiet -- completions bash > dist/completions/jii.bash
          cargo run --quiet -- completions zsh  > dist/completions/_jii
          cargo run --quiet -- completions fish > dist/completions/jii.fish
          cargo run --quiet -- man > dist/jii.1

      - name: Assemble tarball + checksum
        id: pkg
        run: |
          set -euxo pipefail
          tag="${GITHUB_REF_NAME}"
          bin="target/${{ matrix.target }}/release/jii"
          dir="jii-${tag}-${{ matrix.arch }}-linux"
          mkdir -p "$dir/completions"
          cp "$bin" "$dir/"
          cp dist/jii.1 "$dir/"
          cp dist/completions/* "$dir/completions/"
          cp README.md LICENSE "$dir/"
          tar -czf "${dir}.tar.gz" "$dir"
          sha256sum "${dir}.tar.gz" > "${dir}.tar.gz.sha256"
          echo "bin=$bin" >> "$GITHUB_OUTPUT"

      - name: Build .deb and .rpm (nfpm)
        env:
          NFPM_ARCH: ${{ matrix.nfpm_arch }}
          BIN: ${{ steps.pkg.outputs.bin }}
        run: |
          set -euxo pipefail
          tag="${GITHUB_REF_NAME}"
          export VERSION="${tag#v}" # package version has no leading 'v'
          # Render the template ourselves so we don't depend on nfpm's own env expansion
          # (it left ${BIN} unexpanded). Only these three vars are substituted.
          envsubst '${NFPM_ARCH} ${VERSION} ${BIN}' < packaging/nfpm.yaml > nfpm.generated.yaml
          cat nfpm.generated.yaml
          nfpm package -f nfpm.generated.yaml -p deb -t .
          nfpm package -f nfpm.generated.yaml -p rpm -t .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: jii-${{ matrix.arch }}
          path: |
            jii-*-linux.tar.gz
            jii-*-linux.tar.gz.sha256
            *.deb
            *.rpm
          if-no-files-found: error

  release:
    name: publish
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksum the .deb / .rpm
        run: |
          set -euxo pipefail
          cd artifacts
          for f in *.deb *.rpm; do sha256sum "$f" > "$f.sha256"; done
          ls -la

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/*
