# Regenerate the self-hosted growth charts (assets/stars.svg, assets/downloads.svg) and
# commit them when they change. Self-hosting avoids the flaky third-party widgets
# (star-history.com / starchart.cc routinely answer "rate limited"); these render from our
# own GitHub data and always load.
name: Charts

on:
  schedule:
    - cron: "17 4 * * *" # daily, off-peak
  workflow_dispatch: {} # manual "update now"

# Least privilege: read stars, write the committed charts back.
permissions:
  contents: write

concurrency:
  group: charts
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Regenerate the charts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/gen_charts.py "${{ github.repository }}" assets

      - name: Commit if they changed
        run: |
          if git diff --quiet -- assets/stars.svg assets/downloads.svg; then
            echo "No change in the growth charts."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stars.svg assets/downloads.svg
          git commit -m "chore(brand): refresh growth charts"
          git push
