# ── The character of a source ────────────────────────────────────────────────────
# What installing from here is *like*. `long` goes in the verdict sentence; `short`
# is the two words that fit at the end of a list line. Presentation looks these up by
# the character a provider declares — never by its id (ADR-0004/0089).
[nature.system_native]
long = "the distribution's own package, so it updates along with the rest of the system"
short = "system package"
[nature.community_repo]
long = "a community rebuild, but installed by the system's own package manager"
short = "community rebuild"
[nature.sandboxed]
long = "a sandboxed bundle that carries its own runtime"
short = "sandboxed"
[nature.self_contained]
long = "a self-contained build with its own runtime, kept apart from the system"
short = "own runtime"
[nature.built_from_source]
long = "compiled here from source — slower to install, but current afterwards"
short = "built here"
[nature.language_registry]
long = "a language registry, where anyone may publish under any name"
short = "language registry"
[nature.upstream_binary]
long = "the authors' own release binary, taken straight from upstream"
short = "from upstream"

# ── The offer: what was found, which one wins, and what else there is ────────────
[word]
# The conjunction that turns a list into a sentence.
and = "and"

[offer]
verdict = "Best is {source}, version {version} — {nature}."
