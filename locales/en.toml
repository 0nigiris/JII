dry_run_not_installed = "(dry-run: nothing was installed)"
dry_run_not_updated = "(dry-run: nothing was updated)"
dry_run_not_removed = "(dry-run: nothing was removed)"
# What a privileged step is labelled with. Which one shows depends on the machine: the
# helper it will really use, "as root" in a root shell, or a bare "needs root" where
# nothing can grant it. Never the word "sudo" on a host that hasn't got it.
needs_root_via = "  [needs {helper}]"
as_root = "  [as root]"
needs_root = "  [needs root]"
