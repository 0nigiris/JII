# JII UI-строки — русский.
#
# Ключи и их пути должны в точности совпадать с locales/en.toml (проверяется
# тестом). Плейсхолдеры `{name}` подставляет вызывающая сторона через
# `t!("key", name = value)`. Переводим с английского как источника истины.

[common]
aborted = "Отменено."

[install]
searching = "Поиск…"
not_found = "Не найдено: {names}"
not_found_via = "Не найдено через источник «{source}»: {names}"

[doctor]
all_good = "Настраивать нечего — всё в порядке."
