[package]
name = "jii"
version = "0.1.0"
edition = "2024"
description = "Just Install It — a smart universal package installer for Linux"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
thiserror = "2"
anyhow = "1"
directories = "6"
owo-colors = "4"
indicatif = "0.18"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.11"
flate2 = "1"
tar = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }
# Arrow-key TUI choosers (Select); default features off — we only need the menu,
# not fuzzy/history/password/editor (keeps the dep to console + shell-words).
dialoguer = { version = "0.12.0", default-features = false }

[dev-dependencies]
tempfile = "3"
