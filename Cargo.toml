[package]
name = "jii"
version = "0.1.10-beta"
edition = "2024"
description = "Just Install It — a smart universal package installer for Linux"
license = "GPL-3.0-or-later"
repository = "https://github.com/0nigiris/JII"
homepage = "https://github.com/0nigiris/JII"
readme = "README.md"
keywords = ["package-manager", "installer", "cli", "linux", "dnf"]
categories = ["command-line-utilities"]
rust-version = "1.85"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
thiserror = "2"
anyhow = "1"
directories = "6"
owo-colors = "4"
indicatif = "0.18"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time"] }
futures = "0.3"
# multipart: the tester checklist's one-keypress log upload (0x0.st takes a form field).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.11"
flate2 = "1"
tar = "0.4"
zip = { version = "7", default-features = false, features = ["deflate"] }
# Interactive menu chooser: arrow keys + Enter, and **mouse click** to pick. crossterm
# gives raw-mode key + mouse events cross-platform; we drive a tiny inline menu ourselves
# (event + terminal + cursor + style modules only).
crossterm = "0.29"
# Shell completions and a man page (`jii completions <shell>`, `jii man`) — bundled into
# the native packages and release tarballs. Small, build-time-only surface.
clap_complete = "4"
clap_mangen = "0.3"
rnix = "0.14"

[dev-dependencies]
tempfile = "3"

# Release binaries: LTO + a single codegen unit + stripped symbols so the published
# artifact is lean and fast. This trades compile time (a CI concern only) for a smaller,
# faster binary; the default opt-level (3) and unwinding are kept, so behavior is unchanged.
[profile.release]
lto = true
codegen-units = 1
strip = true
