[package]
name = "jii"
version = "0.1.0-beta"
edition = "2024"
description = "Just Install It — a smart universal package installer for Linux"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
directories = "5"
owo-colors = "4"
indicatif = "0.17"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Arrow-key TUI choosers (Select); default features off — we only need the menu,
# not fuzzy/history/password/editor (keeps the dep to console + shell-words).
dialoguer = { version = "0.12.0", default-features = false }
# Shell completions and a man page (`jii completions <shell>`, `jii man`) — bundled into
# the native packages and release tarballs. Small, build-time-only surface.
clap_complete = "4"
clap_mangen = "0.2"

[dev-dependencies]
tempfile = "3"

# Release binaries: LTO + a single codegen unit + stripped symbols so the published
# artifact is lean and fast. This trades compile time (a CI concern only) for a smaller,
# faster binary; the default opt-level (3) and unwinding are kept, so behavior is unchanged.
[profile.release]
lto = true
codegen-units = 1
strip = true
