# --- openSUSE (Leap and Tumbleweed) -----------------------------------------
# Like Fedora, openSUSE ships no patent-encumbered codecs; unlike Fedora, the community
# repo (Packman) is added with a zypper command rather than a release package, so it is a
# `manual` entry the way RPM Fusion is.

[[recommendation]]
id = "packman"
title = "Packman repository"
why = "The community repo openSUSE points at for codecs and the media apps it can't ship itself."
category = "repos"
distros = ["opensuse", "opensuse-leap", "opensuse-tumbleweed", "suse"]
manual = "sudo zypper --non-interactive addrepo --refresh --priority 90 https://ftp.gwdg.de/pub/linux/misc/packman/suse/openSUSE_Tumbleweed/ packman"
note = "A third-party repository — you are extending who you trust for packages. Official instructions: https://en.opensuse.org/Additional_package_repositories#Packman. On Leap, replace openSUSE_Tumbleweed in the URL with your release (e.g. openSUSE_Leap_15.6)."

[[recommendation]]
id = "multimedia-codecs-suse"
title = "Multimedia codecs (GStreamer plugins + ffmpeg)"
why = "Play the video and audio formats openSUSE omits by default, in browsers and media players alike."
category = "media"
distros = ["opensuse", "opensuse-leap", "opensuse-tumbleweed", "suse"]
packages = ["gstreamer-plugins-good", "gstreamer-plugins-bad", "gstreamer-plugins-ugly", "gstreamer-plugins-libav"]
requires = "packman"
note = "Needs Packman enabled first — doctor enables it for you when you accept this."

[[recommendation]]
id = "vlc-suse"
title = "VLC media player"
why = "Plays practically any media file without hunting for codecs."
category = "media"
distros = ["opensuse", "opensuse-leap", "opensuse-tumbleweed", "suse"]
packages = ["vlc"]
requires = "packman"

[[recommendation]]
id = "fonts-core-suse"
title = "Common fonts (emoji + broad Unicode coverage)"
why = "Emoji and non-Latin text render instead of showing empty boxes."
category = "fonts"
distros = ["opensuse", "opensuse-leap", "opensuse-tumbleweed", "suse"]
packages = ["noto-sans-fonts", "noto-coloremoji-fonts", "noto-sans-cjk-fonts"]
