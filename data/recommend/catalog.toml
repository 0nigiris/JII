# JII recommend-catalog — curated system-onboarding suggestions.
#
# This is DATA, not code: `jii doctor` filters these by the host distro and offers
# them interactively (Analyze → Explain → Ask → Apply). Entries either install through
# the normal JII path (`packages`) or, for a step a package install can't express
# (enabling a third-party repo), carry an exact `manual` command shown before it runs.
# `doctor` executes an accepted entry (a read-only run only prints it). A dependent
# entry names its prerequisite via `requires`, so its repo is enabled first (ADR-0055).
#
# Fields:
#   id       stable slug (unique); the anchor a dependent entry's `requires` points at
#   title    one-line human name
#   why      what the user gains
#   category media | repos | drivers | fonts | gaming | power
#   distros  distro ids this applies to (empty = all); matched against Platform.distro
#   packages JII specs to install to satisfy it (optional)
#   manual   an exact command (e.g. enabling a repo), shown before doctor runs it (optional)
#   requires id of a prerequisite entry to enable first (optional) — e.g. "rpmfusion"
#   note     a caveat worth surfacing (optional) — e.g. a trust boundary
#
# Keep entries conservative and honest. Fedora-first (the MVP target); other
# distros get entries as they are verified on a real host.

[[recommendation]]
id = "rpmfusion"
title = "RPM Fusion repositories (free + nonfree)"
why = "Unlocks codecs, some drivers, and apps Fedora can't ship for legal reasons. Many other recommendations below need it first."
category = "repos"
distros = ["fedora"]
manual = "sudo dnf install https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-$(rpm -E %fedora).noarch.rpm"
note = "Third-party repositories — you are extending who you trust for packages. Official RPM Fusion instructions: https://rpmfusion.org/Configuration"
# Already-enabled check: the free release package is installed once RPM Fusion is set up.
check = "rpmfusion-free-release"

[[recommendation]]
id = "multimedia-codecs"
title = "Multimedia codecs (H.264/H.265, AAC, …)"
why = "Play the video and audio formats Fedora omits by default, in browsers and media players alike."
category = "media"
distros = ["fedora"]
packages = ["gstreamer1-plugins-bad-free", "gstreamer1-plugins-ugly", "gstreamer1-plugin-openh264"]
requires = "rpmfusion"
note = "Needs RPM Fusion enabled first — doctor enables it for you when you accept this."

[[recommendation]]
id = "vlc"
title = "VLC media player"
why = "Plays practically any media file without hunting for codecs."
category = "media"
distros = ["fedora"]
packages = ["vlc"]
requires = "rpmfusion"

[[recommendation]]
id = "fonts-core"
title = "Common fonts (emoji + broad Unicode coverage)"
why = "Emoji and non-Latin text render instead of showing empty boxes."
category = "fonts"
distros = ["fedora"]
packages = ["google-noto-emoji-fonts", "google-noto-sans-cjk-fonts"]

[[recommendation]]
id = "steam"
title = "Steam"
why = "The main PC games store; pairs with Proton to run many Windows titles."
category = "gaming"
distros = ["fedora"]
packages = ["steam:flatpak"]
note = "The Flatpak build is sandboxed and the least fuss on Fedora."
# Installed Flatpak app-id (differs from the "steam" install spec).
check = "com.valvesoftware.Steam"

[[recommendation]]
id = "wine"
title = "Wine"
why = "Run many Windows applications and games directly on Linux."
category = "gaming"
distros = ["fedora"]
packages = ["wine"]

[[recommendation]]
id = "power-tuned"
title = "Laptop power tuning (tuned-ppd)"
why = "Better battery life and a power-profile switch on laptops."
category = "power"
distros = ["fedora"]
packages = ["tuned-ppd"]
note = "Mainly useful on laptops; harmless on a desktop but unnecessary."

# --- Arch (and Arch-based: CachyOS, Manjaro, EndeavourOS…) -------------------
# Arch ships codecs/VLC straight from the official repos — no extra-repo prerequisite
# like Fedora's RPM Fusion, so these have no `requires`. (Verified against the repos;
# names may differ on other distros, which is why each entry declares its distros.)

[[recommendation]]
id = "vlc-arch"
title = "VLC media player"
why = "Plays practically any media file without hunting for codecs."
category = "media"
distros = ["arch"]
packages = ["vlc"]

[[recommendation]]
id = "multimedia-codecs-arch"
title = "Multimedia codecs (GStreamer plugins + ffmpeg)"
why = "Lets most players and browsers decode H.264/H.265/AAC and friends."
category = "media"
distros = ["arch"]
packages = ["gst-plugins-good", "gst-plugins-bad", "gst-plugins-ugly", "gst-libav"]

[[recommendation]]
id = "fonts-core-arch"
title = "Common fonts (emoji + broad Unicode coverage)"
why = "Emoji and non-Latin text render instead of showing empty boxes."
category = "fonts"
distros = ["arch"]
packages = ["noto-fonts", "noto-fonts-emoji", "noto-fonts-cjk"]

# Steam via Flatpak is the same everywhere, so it applies to every distro (empty distros).
[[recommendation]]
id = "steam-flatpak"
title = "Steam (Flatpak)"
why = "The main PC games store; the Flatpak build is sandboxed and cross-distro."
category = "gaming"
distros = ["arch"]
packages = ["steam:flatpak"]
check = "com.valvesoftware.Steam"
