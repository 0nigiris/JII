# JII's release notes — the data behind `jii changelog` (and the summary printed after
# `jii update jii`). Embedded in the binary at build time, so it works offline.
#
# ## Rules
#
# * **Newest first.** A test asserts the file is in descending version order and that the
#   version this binary was built as (`CARGO_PKG_VERSION`) is the *first* entry — so a
#   release that forgets its notes fails `cargo test`, not the user.
# * **Write for the user, not the committer.** What changed for someone using JII, in plain
#   language: no ADR numbers, no module names, no commit hashes.
# * `en` is the source of truth; `ru` is the translation. A missing `ru` degrades to `en`
#   (the same rule as `locales/*.toml`) — but both are expected, and a test checks it.
# * `date` is the release date, ISO `YYYY-MM-DD`.

[[release]]
version = "0.1.16-beta"
date = "2026-08-16"
en = [
  "New `jii changelog`: what changed in JII, in plain language. Bare shows the version you're running, `jii changelog 0.1.12` any past release, and `jii changelog --all` the whole history — all of it offline, straight from the binary.",
  "`jii update jii` no longer stops at \"updated\": it finishes by printing everything the new version brought you, including any releases you skipped along the way.",
]
ru = [
  "Новая команда `jii changelog`: что изменилось в JII, человеческим языком. Без аргументов — про версию, которая у вас стоит, `jii changelog 0.1.12` — про любую прошлую, `jii changelog --all` — вся история. Всё офлайн, прямо из бинарника.",
  "`jii update jii` больше не заканчивается словом «обновлено»: в конце он печатает всё, что принесла новая версия, включая релизы, которые вы пропустили.",
]

