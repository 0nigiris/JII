# JII's release notes — the data behind `jii changelog` (and the summary printed after
# `jii update jii`). Embedded in the binary at build time, so it works offline.
#
# ## Rules
#
# * **Newest first.** A test asserts the file is in descending version order and that the
#   version this binary was built as (`CARGO_PKG_VERSION`) is the *first* entry — so a
#   release that forgets its notes fails `cargo test`, not the user.
# * **Write for the user, not the committer.** What changed for someone using JII, in plain
#   language: no ADR numbers, no module names, no commit hashes.
# * `en` is the source of truth; `ru` is the translation. A missing `ru` degrades to `en`
#   (the same rule as `locales/*.toml`) — but both are expected, and a test checks it.
# * `date` is the release date, ISO `YYYY-MM-DD`.

[[release]]
version = "0.1.19-beta"
date = "2026-08-24"
en = [
  "JII no longer tells you to put your GitHub token in `.bashrc`. An exported variable is handed to every program you start and can be read straight out of `/proc` — so JII now reads the token from a file only you can open (`~/.config/jii/github_token`), or takes it from the GitHub CLI with `gh auth token` if you are already signed in there. Setting the variable still works for a one-off run or in CI; it is just no longer the advice.",
  "`jii doctor` now says *where* your token came from — the environment, the file, or the CLI — and never what it is. If the token file is readable by other users on the machine, it says so and offers to lock it down for you.",
]
ru = [
  "JII больше не советует класть токен GitHub в `.bashrc`. Экспортированная переменная достаётся каждой программе, которую вы запускаете, и читается прямо из `/proc` — поэтому теперь JII берёт токен из файла, который можете открыть только вы (`~/.config/jii/github_token`), или у GitHub CLI командой `gh auth token`, если вы там уже вошли. Переменная по-прежнему работает для разового запуска и в CI — просто это больше не рекомендация.",
  "`jii doctor` теперь говорит, *откуда* взялся токен — из окружения, из файла или из CLI — и никогда не показывает его сам. Если файл с токеном могут прочитать другие пользователи машины, он скажет об этом и предложит закрыть доступ.",
]

[[release]]
version = "0.1.18-beta"
date = "2026-08-21"
en = [
  "Asking for a package that doesn't exist used to print **nothing at all** and report success. The \"not found\" message and the browse links had been written all along — a later change made the install path return before it ever reached them. It says so again, and a failed run now exits non-zero instead of claiming everything went fine.",
  "`jii how` answers for software JII didn't install. It used to stop at \"no record\" even for a package sitting right there on your system — while `jii remove` happily removed it. Now it tells you which manager owns it, its version and how far that source is trusted; and for something not installed at all, how JII would install it.",
  "Warnings no longer drift away from what they're about. They go to a different stream than the rest of the output, so the moment you piped JII into a file or a log the two arrived out of order and `jii doctor`'s advice appeared under the wrong check.",
]
ru = [
  "Запрос несуществующего пакета раньше не печатал **вообще ничего** и сообщал об успехе. Сообщение «не найдено» и ссылки на поиск были написаны давно — просто более позднее изменение заставляло установку выйти раньше, чем до них дойдёт. Теперь он снова отвечает, а неудачный запуск завершается с ненулевым кодом, а не делает вид, что всё прошло хорошо.",
  "`jii how` отвечает и про то, что ставил не JII. Раньше он упирался в «нет записи» даже для пакета, который стоит прямо здесь, — при том что `jii remove` его спокойно удалял. Теперь он говорит, какой менеджер им владеет, какая версия и насколько источник доверенный; а если пакет не установлен вовсе — как JII его поставил бы.",
  "Предупреждения больше не уезжают от того, к чему относятся. Они идут в другой поток, чем остальной вывод, — и стоило направить JII в файл или лог, как порядок ломался, и советы `jii doctor` оказывались под чужими проверками.",
]

[[release]]
version = "0.1.17-beta"
date = "2026-08-21"
en = [
  "`jii update jii` only ever offers you a real JII release now. It used to take whatever was published most recently, so a boss-fight bundle released after the last version would have been downloaded as if it were an update. The install script had the same blind spot, and got the same fix.",
]
ru = [
  "`jii update jii` теперь предлагает только настоящие релизы JII. Раньше он брал то, что вышло последним, — и сборка с боем, выпущенная после последней версии, скачалась бы как обновление. У скрипта установки была та же слепота, и то же исправление.",
]

[[release]]
version = "0.1.16-beta"
date = "2026-08-18"
en = [
  "New `jii changelog`: what changed in JII, in plain language. Bare shows the version you're running, `jii changelog 0.1.12` any past release, and `jii changelog --all` the whole history — all of it offline, straight from the binary.",
  "`jii update jii` no longer stops at \"updated\": it finishes by printing everything the new version brought you, including any releases you skipped along the way.",
  "Setting up a package manager now finishes the job. Snap gets its service started and `/snap` linked (without which snapd refuses every install), Flatpak gets its remote whichever way you set it up, and after Homebrew's installer JII offers to add its line to your `.zshrc` for you — and uses brew straight away either way, no new terminal needed.",
  "When a source rejects something, it now explains itself. `jii affinity` used to end in pipx's wall of text; it now says that package is a Python library rather than a program, and points at the two things you can actually do about it.",
  "`jii doctor` checks that Homebrew has a compiler to build with, and offers to install one.",
  "Achievements show a ✓ next to the ones you've earned, so a copied list still tells you which is which — and setting a manager up with `jii sources add` finally counts for 🔧 Bootstrapper.",
  "The scariest-looking trust level is now called \"unverified\" instead of \"untrusted\": it always meant \"JII can't confirm who published this\", not \"this is malware\".",
  "A fourth secret achievement, hidden behind an install path of its own — the hardest one yet. It remembers which way you won.",
]
ru = [
  "Новая команда `jii changelog`: что изменилось в JII, человеческим языком. Без аргументов — про версию, которая у вас стоит, `jii changelog 0.1.12` — про любую прошлую, `jii changelog --all` — вся история. Всё офлайн, прямо из бинарника.",
  "`jii update jii` больше не заканчивается словом «обновлено»: в конце он печатает всё, что принесла новая версия, включая релизы, которые вы пропустили.",
  "Установка менеджера пакетов теперь доводится до конца. Snap получает запущенную службу и ссылку `/snap` (без них snapd отказывает в любой установке), Flatpak — свой репозиторий, каким бы способом вы его ни ставили, а после установщика Homebrew JII сам предложит дописать нужную строку в ваш `.zshrc` — и в любом случае начинает пользоваться brew сразу, без нового терминала.",
  "Если источник чего-то не может, он теперь объясняет. `jii affinity` раньше заканчивался портянкой от pipx; теперь JII говорит, что это библиотека Python, а не программа, и показывает, что с этим реально сделать.",
  "`jii doctor` проверяет, есть ли у Homebrew чем собирать, и предлагает поставить компилятор.",
  "В списке достижений рядом с полученными стоит ✓ — теперь и в скопированном тексте видно, что получено, а что нет. И установка менеджера через `jii sources add` наконец засчитывается на 🔧 «С нуля».",
  "Самый пугающий уровень доверия теперь называется «без проверки», а не «недоверенный»: он всегда значил «JII не может подтвердить, кто это выпустил», а не «это вредонос».",
  "Четвёртое секретное достижение, спрятанное за собственным способом установки — самым сложным на сегодня. Оно помнит, каким путём вы победили.",
]

