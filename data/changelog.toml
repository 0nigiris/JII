# JII's release notes — the data behind `jii changelog` (and the summary printed after
# `jii update jii`). Embedded in the binary at build time, so it works offline.
#
# ## Rules
#
# * **Newest first.** A test asserts the file is in descending version order and that the
#   version this binary was built as (`CARGO_PKG_VERSION`) is the *first* entry — so a
#   release that forgets its notes fails `cargo test`, not the user.
# * **Write for the user, not the committer.** What changed for someone using JII, in plain
#   language: no ADR numbers, no module names, no commit hashes.
# * `en` is the source of truth; `ru` is the translation. A missing `ru` degrades to `en`
#   (the same rule as `locales/*.toml`) — but both are expected, and a test checks it.
# * `date` is the release date, ISO `YYYY-MM-DD`.

[[release]]
version = "0.1.21-beta"
date = "2026-09-06"
en = [
  "**JII talks in sentences now.** Every screen was a table: `jii search htop` printed six aligned rows in which the official Fedora package and an HTML-to-PDF converter that merely shares the name looked equally plausible, and `jii doctor` hid the command that would fix a thing at the far right of a very long line. Now the finding is a sentence — what was found, which one wins, and *why* it wins — and the machinery sits underneath it, indented and quiet.",
  "**There is always a choice.** Wherever JII picked something for you, the alternatives are numbered right there and the prompt takes a number: `Install? [Yes / no / number 2-4]`. Taking a different source no longer means re-running the command with a flag.",
  "**`jii search markdown` now answers with markdown editors.** It used to answer with a library literally called `markdown`, because every source searches by name. Thirty topics — browsers, torrent clients, screen recording, note taking, virtual machines and more — now map what you *meant* to the programs that answer it, in English and in Russian. `jii search браузер` works; it used to find nothing at all.",
  "**`jii doctor` walks you through it, one thing at a time.** Each suggestion gets its own step with a number, a category, and plain prose about what it gains you — answerable with yes, no, or `a` to take all the rest. Its read-only listing also stopped announcing work that was already done.",
  "**The suggestions are in your language.** The codec, VLC, font, Wine and Steam advice was English even in a Russian session. It is translated now, and a test keeps it that way.",
  "**A source now explains itself.** Every line says what installing from there is *like* — the system's own package, a sandbox with its own runtime, built here from source, a registry anyone can publish to — so you can tell what a newer version from Snap actually costs you.",
  "Smaller things: a Flatpak app id shows as `Obsidian`, not `md.obsidian.Obsidian`; one source offering the same package five times is collapsed to one line (Fedora's `steam` did exactly that); counted phrases use real plural forms in Russian.",
  "Under the hood: the project is now a library plus a thin binary, the licensing of every file is machine-checkable, and the six downstream packaging recipes (AUR, Alpine, Void, Nix, Homebrew, Gentoo) are current again after being three months stale.",
]
ru = [
  "**JII теперь говорит фразами.** Каждый экран был таблицей: `jii search htop` печатал шесть выровненных строк, в которых официальный пакет Fedora и конвертер HTML в PDF, просто совпавший именем, выглядели одинаково убедительно, а `jii doctor` прятал команду-исправление в конце очень длинной строки. Теперь находка — это предложение: что нашлось, что лучше и **почему** лучше, — а вся механика уходит вниз, в отступ и в тусклый цвет.",
  "**Выбор есть всегда.** Везде, где JII выбрал за вас, рядом пронумерованы альтернативы, и приглашение принимает номер: `Установить? [Да / нет / номер 2–4]`. Чтобы взять другой источник, больше не нужно перезапускать команду с флагом.",
  "**`jii search markdown` теперь отвечает редакторами Markdown.** Раньше он отвечал библиотекой, которая буквально называется `markdown`, — потому что все источники ищут по имени. Тридцать тем — браузеры, торренты, запись экрана, заметки, виртуальные машины и другие — сопоставляют то, что вы **имели в виду**, с программами, которые это закрывают, по-русски и по-английски. `jii search браузер` работает; раньше он не находил вообще ничего.",
  "**`jii doctor` проводит по одному пункту за раз.** У каждого совета свой шаг с номером, разделом и человеческим объяснением, что он даёт, — отвечать «да», «нет» или «в», чтобы согласиться на всё остальное. А справочный список перестал сообщать о работе, которая уже сделана.",
  "**Советы стали на вашем языке.** Подсказки про кодеки, VLC, шрифты, Wine и Steam были английскими даже в русском сеансе. Теперь они переведены, и тест следит, чтобы так и осталось.",
  "**Источник объясняет сам себя.** В каждой строке написано, каково ставить именно оттуда: родной пакет системы, песочница со своим рантаймом, сборка здесь из исходников, реестр, куда публиковать может кто угодно, — так видно, чего на самом деле стоит более свежая версия из Snap.",
  "Мелочи: идентификатор Flatpak показывается как `Obsidian`, а не `md.obsidian.Obsidian`; пять одинаковых предложений одного источника схлопываются в одну строку (Fedora так выдавала `steam`); числительные в русском получили правильные формы.",
  "Внутри: проект разделён на библиотеку и тонкий бинарник, лицензия каждого файла проверяется машинно, а шесть рецептов упаковки (AUR, Alpine, Void, Nix, Homebrew, Gentoo) снова актуальны — они три месяца висели на старой версии.",
]

[[release]]
version = "0.1.20-beta"
date = "2026-09-05"
en = [
  "**Installing as root works again.** On a machine without `sudo` — a container, a rescue shell — every install failed with \"failed to run sudo: No such file or directory\", even when you already *were* root and needed no help at all. JII now looks at who it is and what the machine actually has: root runs the command directly, `doas` is used where your distro ships that instead, and a system with no way to become root says so in one sentence before anything starts, rather than breaking halfway through.",
  "**The installer no longer guesses your distro from your PATH.** On Arch, Gentoo and Void it could offer \"install system-wide with apt\" and then download a **.deb** — because something else on the machine had put an `apt` on the path. It reads what the system says about itself now. It also offers to put `~/.local/bin` on your PATH for you, in the file your shell actually reads (the old advice used `source`, which simply does not exist in some shells and left people with a `jii` they couldn't run), and a missing `sha256sum` is no longer reported as a corrupt download.",
  "**A search that finds nothing now ends.** Looking for a name that exists nowhere could run for a very long time with a blank screen — on one system long enough to look frozen. Every check is bounded now, the wider second search says that it is happening, and the whole thing finishes in seconds.",
  "**One progress bar stays one line.** On a narrow terminal — a phone, a split window — the bar was wider than the screen, wrapped, and could not be erased, so a single install left hundreds of half-drawn lines behind. It now fits whatever width you have.",
  "**When a package needs a manager that can't be set up here, JII moves on instead of giving up.** It used to skip the package with a confusing note and still report success. Now it installs from the next source that works on your machine — never from an unverified one — or tells you exactly how to set that manager up yourself, and a run that installed nothing no longer claims otherwise.",
  "**Suggestions for the rest of the world.** `jii doctor`'s codec/VLC/font/Steam suggestions existed only for Fedora and Arch; Debian, Ubuntu, Mint and openSUSE now get their own, and a distro based on another inherits its parent's.",
  "**New `jii ghtoken`** — stores your GitHub token for you, without showing it and without it reaching your shell history. `jii ghtoken --show` says where the token being used comes from (never what it is), `--forget` removes it.",
  "Achievements are quieter: they no longer interrupt a `search` or a `doctor`, and live in `jii achievements`. `jii --version` says a bit more about your install.",
]
ru = [
  "**Установка из-под root снова работает.** На машине без `sudo` — в контейнере, в аварийной оболочке — любая установка падала с «failed to run sudo: No such file or directory», даже когда вы уже *были* root и никакая помощь не требовалась. Теперь JII смотрит, кто он и что на машине есть: root выполняет команду напрямую, `doas` используется там, где дистрибутив ставит его вместо sudo, а система, в которой стать root нечем, говорит об этом одной фразой до начала, а не ломается на середине.",
  "**Установщик больше не угадывает дистрибутив по PATH.** На Arch, Gentoo и Void он мог предложить «установить системно через apt» и скачать **.deb** — потому что на машине откуда-то был `apt`. Теперь он читает то, что система говорит о себе сама. Ещё он сам предложит прописать `~/.local/bin` в PATH — в тот файл, который читает именно ваша оболочка (старый совет использовал `source`, которого в некоторых оболочках просто нет, и человек оставался с `jii`, который не запускается). А отсутствие `sha256sum` больше не выдаётся за испорченную закачку.",
  "**Поиск, который ничего не нашёл, теперь заканчивается.** Запрос несуществующего имени мог выполняться очень долго при пустом экране — на одной системе достаточно долго, чтобы выглядеть зависанием. Теперь все проверки ограничены по времени, расширенный поиск сообщает о себе, и всё завершается за секунды.",
  "**Одна полоса прогресса остаётся одной строкой.** На узком терминале — на телефоне, в разделённом окне — полоса была шире экрана, переносилась и не стиралась, так что одна установка оставляла после себя сотни недорисованных строк. Теперь она вписывается в любую ширину.",
  "**Если пакету нужен менеджер, который здесь не поставить, JII идёт дальше, а не сдаётся.** Раньше он пропускал пакет с невнятной припиской и всё равно сообщал об успехе. Теперь он ставит из следующего источника, который работает на вашей машине, — и никогда из непроверенного, — либо объясняет, как поставить этот менеджер самому; а запуск, ничего не установивший, больше не делает вид, что всё получилось.",
  "**Советы не только для Fedora.** Подсказки `jii doctor` про кодеки, VLC, шрифты и Steam были только для Fedora и Arch; теперь свои есть у Debian, Ubuntu, Mint и openSUSE, а дистрибутив, основанный на другом, наследует советы родителя.",
  "**Новая команда `jii ghtoken`** — сохранит ваш токен GitHub за вас, не показывая его и не отправляя в историю оболочки. `jii ghtoken --show` скажет, откуда берётся используемый токен (но не какой он), `--forget` удалит.",
  "Достижения стали тише: они больше не влезают в вывод `search` или `doctor` и живут в `jii achievements`. `jii --version` рассказывает о сборке чуть больше.",
]

[[release]]
version = "0.1.19-beta"
date = "2026-08-24"
en = [
  "JII no longer tells you to put your GitHub token in `.bashrc`. An exported variable is handed to every program you start and can be read straight out of `/proc` — so JII now reads the token from a file only you can open (`~/.config/jii/github_token`), or takes it from the GitHub CLI with `gh auth token` if you are already signed in there. Setting the variable still works for a one-off run or in CI; it is just no longer the advice.",
  "`jii doctor` now says *where* your token came from — the environment, the file, or the CLI — and never what it is. If the token file is readable by other users on the machine, it says so and offers to lock it down for you.",
]
ru = [
  "JII больше не советует класть токен GitHub в `.bashrc`. Экспортированная переменная достаётся каждой программе, которую вы запускаете, и читается прямо из `/proc` — поэтому теперь JII берёт токен из файла, который можете открыть только вы (`~/.config/jii/github_token`), или у GitHub CLI командой `gh auth token`, если вы там уже вошли. Переменная по-прежнему работает для разового запуска и в CI — просто это больше не рекомендация.",
  "`jii doctor` теперь говорит, *откуда* взялся токен — из окружения, из файла или из CLI — и никогда не показывает его сам. Если файл с токеном могут прочитать другие пользователи машины, он скажет об этом и предложит закрыть доступ.",
]

[[release]]
version = "0.1.18-beta"
date = "2026-08-21"
en = [
  "Asking for a package that doesn't exist used to print **nothing at all** and report success. The \"not found\" message and the browse links had been written all along — a later change made the install path return before it ever reached them. It says so again, and a failed run now exits non-zero instead of claiming everything went fine.",
  "`jii how` answers for software JII didn't install. It used to stop at \"no record\" even for a package sitting right there on your system — while `jii remove` happily removed it. Now it tells you which manager owns it, its version and how far that source is trusted; and for something not installed at all, how JII would install it.",
  "Warnings no longer drift away from what they're about. They go to a different stream than the rest of the output, so the moment you piped JII into a file or a log the two arrived out of order and `jii doctor`'s advice appeared under the wrong check.",
]
ru = [
  "Запрос несуществующего пакета раньше не печатал **вообще ничего** и сообщал об успехе. Сообщение «не найдено» и ссылки на поиск были написаны давно — просто более позднее изменение заставляло установку выйти раньше, чем до них дойдёт. Теперь он снова отвечает, а неудачный запуск завершается с ненулевым кодом, а не делает вид, что всё прошло хорошо.",
  "`jii how` отвечает и про то, что ставил не JII. Раньше он упирался в «нет записи» даже для пакета, который стоит прямо здесь, — при том что `jii remove` его спокойно удалял. Теперь он говорит, какой менеджер им владеет, какая версия и насколько источник доверенный; а если пакет не установлен вовсе — как JII его поставил бы.",
  "Предупреждения больше не уезжают от того, к чему относятся. Они идут в другой поток, чем остальной вывод, — и стоило направить JII в файл или лог, как порядок ломался, и советы `jii doctor` оказывались под чужими проверками.",
]

