# JII topic catalog — what a person means when they type a concept, not a package name.
#
# `jii search markdown` used to answer with a library literally named "markdown", because
# every source searches by name and the query happened to be one. What the person wanted was
# a markdown *editor*. This file is the bridge: a topic collects the words someone might type
# — in every shipped language — and names the programs that actually answer them.
#
# It is DATA, not code (the core never learns a package name). The engine looks a query up
# here only when the literal search found no exact name match, so typing a real package name
# always wins; `--exact` skips this layer entirely.
#
# Fields:
#   id        stable slug, unique
#   terms     what the user might type; matched lowercased, whole-word, any language
#   title     English name of the topic
#   title_ru  Russian name (required — same parity rule as the recommend catalog, ADR-0090)
#   picks     program names, best first, that JII should look for. Bare names only: every
#             source gets to answer, and ranking/trust decide as usual.
#
# Keep `picks` short and defensible: the three to six programs a knowledgeable person would
# actually name. This is a curated answer, not a directory.

[[topic]]
id = "markdown-editor"
terms = ["markdown", "md", "маркдаун", "разметка"]
title = "Markdown editors"
title_ru = "Редакторы Markdown"
picks = ["obsidian", "marktext", "ghostwriter", "zettlr", "apostrophe"]

